android.useAndroidX=true
android.enableJetifier=true

# Asignación agresiva de memoria RAM para servidores en la nube
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:+ParallelRefProcEnabled
org.gradle.daemon=false
org.gradle.parallel=false
android.enableDexingArtifactTransform=true
